; Stress and Fear 2026 - Gourmet stress relief (Keyword Item Distributor, no plugin).
; Gives the dishes and drinks of Gourmet - A Cooking Overhaul the keywords Stress and Fear already uses for their vanilla equivalents:
; a warm stew, soup, dumpling or fondue lowers stress by 10 like the vanilla ones, and Gourmet's meads lower it by 25 like vanilla mead.
; Plain cooked meat, roasted vegetables and mushrooms, and the Eversnow drug are left out on purpose (the original mod does not reward them either).
